<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - EventPulse</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Header / Navbar placeholder -->
    <div id="navbar-placeholder"></div>

    <main class="py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-5">
                    
                    <div id="alertContainer"></div>

                    <div class="card shadow-sm border-0 rounded-4">
                        <div class="card-body p-4 p-sm-5">
                            <div class="text-center mb-4">
                                <div class="bg-primary bg-opacity-10 text-primary d-inline-flex p-3 rounded-circle mb-2">
                                    <i class="bi bi-person-plus-fill fs-2"></i>
                                </div>
                                <h3 class="fw-bold">Create Account</h3>
                                <p class="text-muted small">Join EventPulse to book events and track tickets</p>
                            </div>

                            <form id="registerForm" onsubmit="handleRegister(event)">
                                <div class="mb-3">
                                    <label for="name" class="form-label fw-semibold small">Full Name</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light"><i class="bi bi-person text-muted"></i></span>
                                        <input type="text" class="form-control" id="name" placeholder="John Doe" required>
                                    </div>
                                </div>

                                <div class="mb-3">
                                    <label for="email" class="form-label fw-semibold small">Email Address</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light"><i class="bi bi-envelope text-muted"></i></span>
                                        <input type="email" class="form-control" id="email" placeholder="john@example.com" required>
                                    </div>
                                </div>

                                <div class="mb-3">
                                    <label for="password" class="form-label fw-semibold small">Password</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light"><i class="bi bi-shield-lock text-muted"></i></span>
                                        <input type="password" class="form-control" id="password" placeholder="At least 6 characters" minlength="4" required>
                                    </div>
                                </div>

                                <div class="mb-4">
                                    <label for="role" class="form-label fw-semibold small">Account Role</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light"><i class="bi bi-person-badge text-muted"></i></span>
                                        <select class="form-select" id="role" required>
                                            <option value="USER" selected>Attendee (Standard User)</option>
                                            <option value="ADMIN">Administrator (Event Organizer)</option>
                                        </select>
                                    </div>
                                    <div class="form-text small">Select Administrator to create and manage events.</div>
                                </div>

                                <button type="submit" id="submitBtn" class="btn btn-primary w-100 py-2 mb-3">
                                    <span id="btnSpinner" class="spinner-border spinner-border-sm d-none me-1" role="status"></span>
                                    Register Account
                                </button>
                            </form>

                            <div class="text-center text-muted small">
                                Already have an account? <a href="login.html" class="fw-semibold text-primary">Log in here</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <div class="container text-center">
            <p class="mb-0 text-secondary small">EventPulse - Event Management System</p>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/navbar.js"></script>
    <script>
        async function handleRegister(e) {
            e.preventDefault();
            const name = document.getElementById("name").value.trim();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const role = document.getElementById("role").value;
            const submitBtn = document.getElementById("submitBtn");
            const btnSpinner = document.getElementById("btnSpinner");

            submitBtn.disabled = true;
            btnSpinner.classList.remove("d-none");

            try {
                const response = await fetch(`${API_BASE}/api/users/register`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ name, email, password, role })
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    showAlert("alertContainer", "Registration successful! Redirecting to login...", "success");
                    setTimeout(() => {
                        window.location.href = "login.html";
                    }, 1200);
                } else {
                    showAlert("alertContainer", result.message || "Registration failed.", "danger");
                }
            } catch (err) {
                showAlert("alertContainer", "Unable to connect to backend server.", "danger");
            } finally {
                submitBtn.disabled = false;
                btnSpinner.classList.add("d-none");
            }
        }
    </script>
</body>
</html>
