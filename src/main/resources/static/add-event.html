<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Editor - EventPulse</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Header / Navbar placeholder -->
    <div id="navbar-placeholder"></div>

    <main class="py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="mb-3">
                        <a href="admin-dashboard.html" class="btn btn-outline-secondary btn-sm">
                            <i class="bi bi-arrow-left me-1"></i> Back to Admin Dashboard
                        </a>
                    </div>

                    <div id="alertContainer"></div>

                    <div class="card border-0 shadow-sm rounded-4">
                        <div class="card-body p-4 p-md-5">
                            <div class="mb-4">
                                <h3 id="formHeading" class="fw-bold text-dark">Add New Event</h3>
                                <p id="formSubheading" class="text-muted small">Fill in the event details, venue schedule and maximum capacity.</p>
                            </div>

                            <form id="eventForm" onsubmit="handleEventSubmit(event)">
                                <div class="mb-3">
                                    <label for="eventTitle" class="form-label fw-semibold small">Event Title *</label>
                                    <input type="text" class="form-control" id="eventTitle" placeholder="e.g. AI & Cloud Architecture Summit" required>
                                </div>

                                <div class="row g-3 mb-3">
                                    <div class="col-md-6">
                                        <label for="eventCategory" class="form-label fw-semibold small">Category *</label>
                                        <select class="form-select" id="eventCategory" required>
                                            <option value="" disabled selected>Select Category</option>
                                            <option value="Technology">Technology</option>
                                            <option value="Music">Music</option>
                                            <option value="Workshop">Workshop</option>
                                            <option value="Business">Business</option>
                                            <option value="Gaming">Gaming</option>
                                            <option value="Health">Health</option>
                                        </select>
                                    </div>
                                    <div class="col-md-6">
                                        <label for="eventDate" class="form-label fw-semibold small">Event Date *</label>
                                        <input type="date" class="form-control" id="eventDate" required>
                                    </div>
                                </div>

                                <div class="row g-3 mb-3">
                                    <div class="col-md-8">
                                        <label for="eventLocation" class="form-label fw-semibold small">Location / Venue *</label>
                                        <input type="text" class="form-control" id="eventLocation" placeholder="e.g. Moscone Center, San Francisco, CA" required>
                                    </div>
                                    <div class="col-md-4">
                                        <label for="eventCapacity" class="form-label fw-semibold small">Total Capacity *</label>
                                        <input type="number" class="form-control" id="eventCapacity" min="1" placeholder="e.g. 100" required>
                                    </div>
                                </div>

                                <div class="mb-4">
                                    <label for="eventDescription" class="form-label fw-semibold small">Event Description</label>
                                    <textarea class="form-control" id="eventDescription" rows="4" placeholder="Provide event schedule, speaker info, agenda or requirements..."></textarea>
                                </div>

                                <div class="d-flex justify-content-end gap-2">
                                    <a href="admin-dashboard.html" class="btn btn-outline-secondary px-4">Cancel</a>
                                    <button type="submit" id="submitBtn" class="btn btn-primary px-4">
                                        <span id="btnSpinner" class="spinner-border spinner-border-sm d-none me-1" role="status"></span>
                                        <span id="submitBtnText">Create Event</span>
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <div class="container text-center">
            <p class="mb-0 text-secondary small">EventPulse - Event Management System</p>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/navbar.js"></script>
    <script>
        let editEventId = null;

        document.addEventListener("DOMContentLoaded", function () {
            requireAuth("ADMIN");

            const params = new URLSearchParams(window.location.search);
            editEventId = params.get("id");

            if (editEventId) {
                document.getElementById("formHeading").textContent = "Edit Event";
                document.getElementById("formSubheading").textContent = "Update event details and capacity allocation.";
                document.getElementById("submitBtnText").textContent = "Update Event";
                loadExistingEvent(editEventId);
            }
        });

        async function loadExistingEvent(id) {
            try {
                const response = await fetch(`${API_BASE}/api/events/${id}`);
                const result = await response.json();

                if (response.ok && result.success && result.data) {
                    const e = result.data;
                    document.getElementById("eventTitle").value = e.title;
                    document.getElementById("eventCategory").value = e.category;
                    document.getElementById("eventDate").value = e.date;
                    document.getElementById("eventLocation").value = e.location;
                    document.getElementById("eventCapacity").value = e.capacity;
                    document.getElementById("eventDescription").value = e.description || "";
                } else {
                    showAlert("alertContainer", "Unable to load event for editing.", "danger");
                }
            } catch (err) {
                showAlert("alertContainer", "Failed to contact backend server.", "danger");
            }
        }

        async function handleEventSubmit(e) {
            e.preventDefault();

            const title = document.getElementById("eventTitle").value.trim();
            const category = document.getElementById("eventCategory").value;
            const date = document.getElementById("eventDate").value;
            const location = document.getElementById("eventLocation").value.trim();
            const capacity = parseInt(document.getElementById("eventCapacity").value, 10);
            const description = document.getElementById("eventDescription").value.trim();

            const submitBtn = document.getElementById("submitBtn");
            const btnSpinner = document.getElementById("btnSpinner");
            submitBtn.disabled = true;
            btnSpinner.classList.remove("d-none");

            const payload = {
                title,
                category,
                date,
                location,
                capacity,
                description
            };

            const url = editEventId ? `${API_BASE}/api/events/${editEventId}` : `${API_BASE}/api/events`;
            const method = editEventId ? "PUT" : "POST";

            try {
                const response = await fetch(url, {
                    method: method,
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    showAlert("alertContainer", editEventId ? "Event updated successfully!" : "Event created successfully!", "success");
                    setTimeout(() => {
                        window.location.href = "admin-dashboard.html";
                    }, 1000);
                } else {
                    showAlert("alertContainer", result.message || "Failed to save event.", "danger");
                }
            } catch (err) {
                showAlert("alertContainer", "Server error while saving event.", "danger");
            } finally {
                submitBtn.disabled = false;
                btnSpinner.classList.add("d-none");
            }
        }
    </script>
</body>
</html>
