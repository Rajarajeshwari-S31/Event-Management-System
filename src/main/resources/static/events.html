<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse Events - EventPulse</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Header / Navbar placeholder -->
    <div id="navbar-placeholder"></div>

    <main class="py-4">
        <div class="container">
            <!-- Header title -->
            <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4">
                <div>
                    <h2 class="fw-bold mb-1">Explore Upcoming Events</h2>
                    <p class="text-muted mb-0">Search, filter by category or location, and register instantly.</p>
                </div>
            </div>

            <div id="alertContainer"></div>

            <!-- Search & Filter Controls -->
            <div class="filter-box mb-4">
                <form id="filterForm" class="row g-3" onsubmit="handleFilterSubmit(event)">
                    <div class="col-md-4">
                        <label for="searchTitle" class="form-label small fw-semibold text-muted">Event Title / Keyword</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
                            <input type="text" id="searchTitle" class="form-control" placeholder="e.g. Summit, Music, Design...">
                        </div>
                    </div>
                    <div class="col-md-3">
                        <label for="filterCategory" class="form-label small fw-semibold text-muted">Category</label>
                        <select id="filterCategory" class="form-select">
                            <option value="">All Categories</option>
                            <option value="Technology">Technology</option>
                            <option value="Music">Music</option>
                            <option value="Workshop">Workshop</option>
                            <option value="Business">Business</option>
                            <option value="Gaming">Gaming</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label for="filterLocation" class="form-label small fw-semibold text-muted">City / Location</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white"><i class="bi bi-geo-alt"></i></span>
                            <input type="text" id="filterLocation" class="form-control" placeholder="e.g. San Francisco, Austin...">
                        </div>
                    </div>
                    <div class="col-md-2 d-flex align-items-end gap-2">
                        <button type="submit" class="btn btn-primary w-100">
                            <i class="bi bi-funnel-fill me-1"></i> Filter
                        </button>
                        <button type="button" class="btn btn-outline-secondary" title="Reset Filters" onclick="resetFilters()">
                            <i class="bi bi-arrow-counterclockwise"></i>
                        </button>
                    </div>
                </form>
            </div>

            <!-- Events Grid -->
            <div id="eventsGrid" class="row g-4">
                <!-- Dynamically populated -->
                <div class="col-12 text-center py-5">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading events...</span>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <div class="container text-center">
            <p class="mb-0 text-secondary small">EventPulse - Full Stack Event Management System</p>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/navbar.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            // Check URL parameters for preset search
            const params = new URLSearchParams(window.location.search);
            const titleParam = params.get("title");
            const categoryParam = params.get("category");
            const locationParam = params.get("location");

            if (titleParam) document.getElementById("searchTitle").value = titleParam;
            if (categoryParam) document.getElementById("filterCategory").value = categoryParam;
            if (locationParam) document.getElementById("filterLocation").value = locationParam;

            fetchEvents(titleParam, categoryParam, locationParam);
        });

        function handleFilterSubmit(e) {
            e.preventDefault();
            const title = document.getElementById("searchTitle").value.trim();
            const category = document.getElementById("filterCategory").value;
            const location = document.getElementById("filterLocation").value.trim();
            fetchEvents(title, category, location);
        }

        function resetFilters() {
            document.getElementById("searchTitle").value = "";
            document.getElementById("filterCategory").value = "";
            document.getElementById("filterLocation").value = "";
            fetchEvents();
        }

        async function fetchEvents(title = "", category = "", location = "") {
            const grid = document.getElementById("eventsGrid");
            grid.innerHTML = `
                <div class="col-12 text-center py-5">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading events...</span>
                    </div>
                </div>
            `;

            try {
                let url = `${API_BASE}/api/events/search?`;
                const params = [];
                if (title) params.push(`title=${encodeURIComponent(title)}`);
                if (category) params.push(`category=${encodeURIComponent(category)}`);
                if (location) params.push(`location=${encodeURIComponent(location)}`);
                url += params.join("&");

                const response = await fetch(url);
                const result = await response.json();

                if (result.success && result.data && result.data.length > 0) {
                    grid.innerHTML = result.data.map(event => renderEventCard(event)).join("");
                } else {
                    grid.innerHTML = `
                        <div class="col-12 text-center py-5">
                            <i class="bi bi-search text-muted fs-1 mb-3"></i>
                            <h5 class="fw-bold text-dark">No matching events found</h5>
                            <p class="text-muted">Try adjusting your search criteria or resetting filters.</p>
                            <button class="btn btn-outline-primary btn-sm" onclick="resetFilters()">Reset Filters</button>
                        </div>
                    `;
                }
            } catch (err) {
                grid.innerHTML = `
                    <div class="col-12 text-center py-5">
                        <p class="text-danger">Failed to load events. Please check the backend service.</p>
                    </div>
                `;
            }
        }

        function renderEventCard(event) {
            const isFull = event.availableSeats <= 0;
            const seatBadge = isFull 
                ? `<span class="badge-seats-full"><i class="bi bi-x-circle me-1"></i>Sold Out (0 / ${event.capacity})</span>`
                : `<span class="badge-seats-available"><i class="bi bi-check-circle me-1"></i>${event.availableSeats} of ${event.capacity} seats left</span>`;

            return `
                <div class="col-md-6 col-lg-4">
                    <div class="card card-event h-100">
                        <div class="card-body p-4 d-flex flex-column">
                            <div class="d-flex justify-content-between align-items-center mb-2">
                                <span class="badge-category">${event.category}</span>
                                ${seatBadge}
                            </div>
                            <h5 class="card-title fw-bold text-dark mt-2 mb-2">${event.title}</h5>
                            <p class="card-text text-muted small flex-grow-1">
                                ${event.description ? (event.description.length > 120 ? event.description.substring(0, 120) + '...' : event.description) : 'No description provided.'}
                            </p>
                            
                            <div class="border-top pt-3 mt-3 text-secondary small">
                                <div class="mb-1"><i class="bi bi-calendar3 me-2 text-primary"></i><strong>Date:</strong> ${formatDate(event.date)}</div>
                                <div class="text-truncate mb-1"><i class="bi bi-geo-alt me-2 text-danger"></i>${event.location}</div>
                                <div><i class="bi bi-people me-2 text-info"></i><strong>Total Capacity:</strong> ${event.capacity}</div>
                            </div>

                            <div class="d-flex gap-2 pt-3">
                                <a href="event-details.html?id=${event.id}" class="btn btn-outline-primary btn-sm flex-fill">
                                    <i class="bi bi-info-circle me-1"></i>Details
                                </a>
                                <button onclick="quickRegister(${event.id}, ${isFull})" 
                                    class="btn ${isFull ? 'btn-secondary disabled' : 'btn-primary'} btn-sm flex-fill" 
                                    ${isFull ? 'disabled' : ''}>
                                    <i class="bi bi-ticket-perforated me-1"></i>${isFull ? 'Sold Out' : 'Register'}
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        async function quickRegister(eventId, isFull) {
            if (isFull) {
                showAlert("alertContainer", "Sorry, this event is fully booked!", "warning");
                return;
            }

            const user = getCurrentUser();
            if (!user) {
                alert("Please log in to register for events.");
                window.location.href = `login.html`;
                return;
            }

            if (!confirm("Confirm registration for this event?")) {
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/api/registrations`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ userId: user.id, eventId: eventId })
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    showAlert("alertContainer", "Registered successfully! Check 'My Registrations' to view your ticket.", "success");
                    // Refresh events grid to update seat counts
                    handleFilterSubmit(new Event("submit"));
                } else {
                    showAlert("alertContainer", result.message || "Registration failed.", "danger");
                }
            } catch (err) {
                showAlert("alertContainer", "Error contacting server.", "danger");
            }
        }
    </script>
</body>
</html>
