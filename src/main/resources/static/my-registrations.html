<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Registrations - EventPulse</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Header / Navbar placeholder -->
    <div id="navbar-placeholder"></div>

    <main class="py-5">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h2 class="fw-bold mb-1">My Registrations</h2>
                    <p class="text-muted mb-0">Track all your event bookings and manage ticket cancellations.</p>
                </div>
                <a href="events.html" class="btn btn-primary">
                    <i class="bi bi-search me-1"></i> Browse More Events
                </a>
            </div>

            <div id="alertContainer"></div>

            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-body p-4">
                    <div id="registrationsLoading" class="text-center py-5">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Loading tickets...</span>
                        </div>
                    </div>

                    <div id="registrationsContent" class="d-none">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle">
                                <thead class="table-light">
                                    <tr>
                                        <th scope="col">Booking #</th>
                                        <th scope="col">Event</th>
                                        <th scope="col">Category</th>
                                        <th scope="col">Event Date</th>
                                        <th scope="col">Venue</th>
                                        <th scope="col">Status</th>
                                        <th scope="col" class="text-end">Action</th>
                                    </tr>
                                </thead>
                                <tbody id="registrationsTableBody">
                                    <!-- Dynamic rows -->
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <div id="noRegistrationsState" class="text-center py-5 d-none">
                        <i class="bi bi-ticket-perforated text-muted fs-1 mb-3"></i>
                        <h5 class="fw-bold text-dark">No registrations found</h5>
                        <p class="text-muted mb-3">You haven't registered for any events yet.</p>
                        <a href="events.html" class="btn btn-primary">
                            <i class="bi bi-compass me-1"></i> Discover Events
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <div class="container text-center">
            <p class="mb-0 text-secondary small">EventPulse - Event Management System</p>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/navbar.js"></script>
    <script>
        let currentUser = null;

        document.addEventListener("DOMContentLoaded", function () {
            currentUser = requireAuth();
            if (!currentUser) return;

            loadUserRegistrations();
        });

        async function loadUserRegistrations() {
            try {
                const response = await fetch(`${API_BASE}/api/registrations/user/${currentUser.id}`);
                const result = await response.json();

                const loadingEl = document.getElementById("registrationsLoading");
                const contentEl = document.getElementById("registrationsContent");
                const emptyEl = document.getElementById("noRegistrationsState");
                const tableBody = document.getElementById("registrationsTableBody");

                loadingEl.classList.add("d-none");

                if (result.success && result.data && result.data.length > 0) {
                    contentEl.classList.remove("d-none");
                    emptyEl.classList.add("d-none");

                    tableBody.innerHTML = result.data.map(reg => {
                        const isConfirmed = reg.status === "CONFIRMED";
                        const statusBadge = isConfirmed
                            ? `<span class="badge bg-success-subtle text-success border border-success px-2 py-1"><i class="bi bi-check-circle me-1"></i>Confirmed</span>`
                            : `<span class="badge bg-secondary-subtle text-secondary border border-secondary px-2 py-1"><i class="bi bi-x-circle me-1"></i>Cancelled</span>`;

                        const cancelBtn = isConfirmed
                            ? `<button class="btn btn-outline-danger btn-sm" onclick="cancelRegistration(${reg.id})">
                                 <i class="bi bi-trash3 me-1"></i>Cancel
                               </button>`
                            : `<span class="text-muted small">Cancelled</span>`;

                        return `
                            <tr>
                                <td class="fw-semibold text-muted">#${reg.id}</td>
                                <td>
                                    <a href="event-details.html?id=${reg.eventId}" class="fw-bold text-dark text-decoration-none hover-primary">
                                        ${reg.eventTitle || 'Event #' + reg.eventId}
                                    </a>
                                </td>
                                <td><span class="badge-category">${reg.eventCategory || 'General'}</span></td>
                                <td><i class="bi bi-calendar3 me-1 text-primary"></i>${formatDate(reg.eventDate)}</td>
                                <td><i class="bi bi-geo-alt me-1 text-danger"></i>${reg.eventLocation || 'N/A'}</td>
                                <td>${statusBadge}</td>
                                <td class="text-end">${cancelBtn}</td>
                            </tr>
                        `;
                    }).join("");
                } else {
                    contentEl.classList.add("d-none");
                    emptyEl.classList.remove("d-none");
                }
            } catch (err) {
                showAlert("alertContainer", "Failed to fetch registrations from server.", "danger");
            }
        }

        async function cancelRegistration(registrationId) {
            if (!confirm("Are you sure you want to cancel this booking? The seat will be released for other attendees.")) {
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/api/registrations/${registrationId}`, {
                    method: "DELETE"
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    showAlert("alertContainer", "Registration cancelled successfully. The seat has been restored.", "info");
                    loadUserRegistrations();
                } else {
                    showAlert("alertContainer", result.message || "Failed to cancel registration.", "danger");
                }
            } catch (err) {
                showAlert("alertContainer", "Unable to cancel registration. Server error.", "danger");
            }
        }
    </script>
</body>
</html>
