<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - EventPulse</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Header / Navbar placeholder -->
    <div id="navbar-placeholder"></div>

    <main class="py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-7 col-lg-5">
                    
                    <div id="alertContainer"></div>

                    <div class="card shadow-sm border-0 rounded-4">
                        <div class="card-body p-4 p-sm-5">
                            <div class="text-center mb-4">
                                <div class="bg-primary bg-opacity-10 text-primary d-inline-flex p-3 rounded-circle mb-2">
                                    <i class="bi bi-person-lock fs-2"></i>
                                </div>
                                <h3 class="fw-bold">Sign In</h3>
                                <p class="text-muted small">Access your EventPulse dashboard & bookings</p>
                            </div>

                            <form id="loginForm" onsubmit="handleLogin(event)">
                                <div class="mb-3">
                                    <label for="email" class="form-label fw-semibold small">Email Address</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light"><i class="bi bi-envelope text-muted"></i></span>
                                        <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                                    </div>
                                </div>

                                <div class="mb-4">
                                    <label for="password" class="form-label fw-semibold small">Password</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light"><i class="bi bi-key text-muted"></i></span>
                                        <input type="password" class="form-control" id="password" placeholder="••••••••" required>
                                    </div>
                                </div>

                                <button type="submit" id="submitBtn" class="btn btn-primary w-100 py-2 mb-3">
                                    <span id="btnSpinner" class="spinner-border spinner-border-sm d-none me-1" role="status"></span>
                                    Sign In
                                </button>
                            </form>

                            <!-- Demo Quick Fill Buttons -->
                            <div class="bg-light p-3 rounded-3 border mb-3">
                                <div class="text-muted small fw-semibold mb-2 text-center">
                                    <i class="bi bi-lightning-charge-fill text-warning me-1"></i> Quick Test Credentials:
                                </div>
                                <div class="d-flex gap-2">
                                    <button type="button" class="btn btn-sm btn-outline-secondary w-50" onclick="fillCredentials('admin@ems.com', 'admin123')">
                                        <i class="bi bi-shield-lock me-1"></i> Admin Demo
                                    </button>
                                    <button type="button" class="btn btn-sm btn-outline-secondary w-50" onclick="fillCredentials('john@example.com', 'user123')">
                                        <i class="bi bi-person me-1"></i> User Demo
                                    </button>
                                </div>
                            </div>

                            <div class="text-center text-muted small">
                                Don't have an account? <a href="register.html" class="fw-semibold text-primary">Sign up here</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <div class="container text-center">
            <p class="mb-0 text-secondary small">EventPulse - Event Management System</p>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/navbar.js"></script>
    <script>
        function fillCredentials(email, password) {
            document.getElementById("email").value = email;
            document.getElementById("password").value = password;
        }

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const submitBtn = document.getElementById("submitBtn");
            const btnSpinner = document.getElementById("btnSpinner");

            submitBtn.disabled = true;
            btnSpinner.classList.remove("d-none");

            try {
                const response = await fetch(`${API_BASE}/api/users/login`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, password })
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    setCurrentUser(result.data);
                    showAlert("alertContainer", "Login successful! Redirecting...", "success");

                    setTimeout(() => {
                        if (result.data.role === "ADMIN") {
                            window.location.href = "admin-dashboard.html";
                        } else {
                            window.location.href = "events.html";
                        }
                    }, 800);
                } else {
                    showAlert("alertContainer", result.message || "Invalid email or password", "danger");
                }
            } catch (err) {
                showAlert("alertContainer", "Unable to connect to server. Ensure backend is running.", "danger");
            } finally {
                submitBtn.disabled = false;
                btnSpinner.classList.add("d-none");
            }
        }
    </script>
</body>
</html>
