# Server Configuration
server.port=8080

# Spring Application Name
spring.application.name=Smart Event Management System

# MySQL Database Configuration (overridable via environment variables)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/event_management_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Static Resources Configuration
spring.web.resources.static-locations=classpath:/static/
